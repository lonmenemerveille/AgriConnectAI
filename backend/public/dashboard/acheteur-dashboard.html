<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AgriConnectAI - Espace acheteur</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{--fond:#12201a;--panneau:#1a2d24;--trait:#2c4638;--texte:#e8efe9;--discret:#9db3a5;--accent:#e0a93b;--ok:#5fbf8a;--danger:#e06a5a}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;font-family:"Segoe UI",system-ui,sans-serif;background:var(--fond);color:var(--texte);line-height:1.5}
header{display:flex;flex-wrap:wrap;align-items:center;gap:16px;padding:14px 20px;border-bottom:1px solid var(--trait)}
h1{font-size:1.2rem;margin:0 auto 0 0}
h2{font-size:1.05rem;margin:0 0 12px}
main{padding:20px;max-width:1100px;margin:auto}
button{font:inherit;cursor:pointer;border:1px solid var(--trait);background:var(--panneau);color:var(--texte);padding:8px 14px;border-radius:6px}
button.actif,button.principal{background:var(--accent);color:#1b1608;border-color:var(--accent);font-weight:600}
button.lien{border:0;background:none;color:var(--danger);padding:0}
button:disabled{opacity:.5;cursor:not-allowed}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,select,textarea{font:inherit;background:var(--fond);color:var(--texte);border:1px solid var(--trait);border-radius:6px;padding:8px}
.filtres{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.deux{display:grid;grid-template-columns:2fr 1fr;gap:20px}
@media(max-width:760px){.deux{grid-template-columns:1fr}}
.bloc{background:var(--panneau);border:1px solid var(--trait);border-radius:8px;padding:16px}
.ligne{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--trait)}
.discret{color:var(--discret);font-size:.9rem}
.vide{color:var(--discret)}
.badge{padding:2px 10px;border-radius:99px;font-size:.85rem;border:1px solid currentColor}
.non_traitee{color:var(--discret)}.en_cours{color:var(--accent)}.validee{color:var(--ok)}
#form-commande{display:grid;gap:8px;margin-top:12px}
#message{min-height:1.6em;padding:0 20px;color:var(--ok)}
#message.erreur{color:var(--danger)}
#carte{height:300px;border-radius:8px;margin:12px 0}
</style>
</head>
<body>
<header>
  <h1>AgriConnectAI, espace acheteur</h1>
  <nav>
    <button data-vue="produits" class="actif">Produits</button>
    <button data-vue="livraisons">Mes livraisons</button>
  </nav>
</header>
<p id="message" role="status"></p>
<main>
  <section id="vue-produits">
    <form id="filtres" class="filtres">
      <input name="q" placeholder="Produit (ex. ananas)">
      <input name="categorie" placeholder="Catégorie">
      <input name="ville" placeholder="Ville">
      <input name="prixMax" type="number" min="0" placeholder="Prix max (FCFA)">
      <button class="principal">Filtrer</button>
    </form>
    <div class="deux">
      <div class="bloc"><h2>Produits disponibles</h2><div id="liste-produits"></div></div>
      <aside class="bloc">
        <h2>Mon panier</h2>
        <div id="lignes-panier"></div>
        <p>Total : <strong id="total">0 FCFA</strong></p>
        <form id="form-commande">
          <select name="mode_paiement" required>
            <option value="mtn_momo">MTN Mobile Money</option>
            <option value="orange_money">Orange Money</option>
            <option value="carte">Carte bancaire</option>
          </select>
          <input name="telephone" type="tel" placeholder="Numéro de téléphone">
          <button id="commander" class="principal" disabled>Commander et payer</button>
        </form>
      </aside>
    </div>
  </section>

  <section id="vue-livraisons" hidden>
    <div class="deux">
      <div class="bloc"><h2>Mes livraisons</h2><div id="liste-livraisons"></div></div>
      <div class="bloc" id="detail-livraison"><p class="vide">Choisissez une livraison pour la suivre sur la carte.</p></div>
    </div>
  </section>
</main>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const ID_ACHETEUR = localStorage.getItem('id_utilisateur') || '1'; // à relier à ta connexion
const STATUTS = { non_traitee: 'Non traitée', en_cours: 'En cours', validee: 'Validée' };
const panier = new Map();
let produits = [];
let carte = null, marqueur = null, minuteur = null;

const $ = (s) => document.querySelector(s);
const esc = (t) => String(t ?? '').replace(/[&<>"']/g, (c) =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fcfa = (n) => Number(n).toLocaleString('fr-FR') + ' FCFA';

async function api(chemin, options = {}) {
  const rep = await fetch('/api/acheteur' + chemin, {
    ...options,
    headers: { 'Content-Type': 'application/json', 'x-user-id': ID_ACHETEUR },
  });
  const data = await rep.json().catch(() => ({}));
  if (!rep.ok) throw new Error(data.erreur || 'Erreur serveur.');
  return data;
}

function message(texte, erreur = false) {
  const m = $('#message');
  m.textContent = texte;
  m.className = erreur ? 'erreur' : '';
}

/* ---------- Produits et panier ---------- */
async function chargerProduits() {
  const params = new URLSearchParams(new FormData($('#filtres')));
  for (const [k, v] of [...params]) if (!v) params.delete(k);
  try { produits = await api('/produits?' + params); }
  catch (e) { return message(e.message, true); }
  $('#liste-produits').innerHTML = produits.length
    ? produits.map((p) => `
      <div class="ligne">
        <div><strong>${esc(p.nom)}</strong><br>
          <span class="discret">${esc(p.producteur)}, ${esc(p.ville)}. Stock : ${p.quantite_disponible}</span></div>
        <div>${fcfa(p.prix)}</div>
        <button data-ajouter="${p.id_produit}">Ajouter</button>
      </div>`).join('')
    : '<p class="vide">Aucun produit ne correspond à ces filtres. Élargissez la recherche.</p>';
}

function dessinerPanier() {
  const lignes = [...panier.values()];
  const total = lignes.reduce((s, l) => s + l.produit.prix * l.quantite, 0);
  $('#lignes-panier').innerHTML = lignes.length
    ? lignes.map(({ produit: p, quantite }) => `
      <div class="ligne">
        <span>${esc(p.nom)}</span>
        <input type="number" min="1" max="${p.quantite_disponible}" value="${quantite}"
               data-qte="${p.id_produit}" style="width:70px">
        <button type="button" class="lien" data-retirer="${p.id_produit}">Retirer</button>
      </div>`).join('')
    : '<p class="vide">Votre panier est vide. Ajoutez un produit.</p>';
  $('#total').textContent = fcfa(total);
  $('#commander').disabled = !lignes.length;
}

/* ---------- Livraisons et carte ---------- */
async function chargerLivraisons() {
  try {
    const liste = await api('/livraisons');
    $('#liste-livraisons').innerHTML = liste.length
      ? liste.map((l) => `
        <div class="ligne">
          <div><strong>${esc(l.produits)}</strong><br>
            <span class="discret">Commande n°${l.id_commande}</span></div>
          <span class="badge ${esc(l.statut)}">${STATUTS[l.statut] || esc(l.statut)}</span>
          <button data-voir="${l.id_livraison}">Suivre</button>
        </div>`).join('')
      : '<p class="vide">Aucune livraison pour le moment. Passez une commande.</p>';
  } catch (e) { message(e.message, true); }
}

function formulaireAvis(d) {
  return `
    <form id="form-avis" style="display:grid;gap:8px">
      <h2>Évaluer ${esc(d.producteur)}</h2>
      <input type="hidden" name="id_producteur" value="${d.id_producteur}">
      <select name="note">
        <option value="5">5 sur 5</option><option value="4">4 sur 5</option>
        <option value="3">3 sur 5</option><option value="2">2 sur 5</option>
        <option value="1">1 sur 5</option>
      </select>
      <textarea name="commentaire" rows="2" placeholder="Votre commentaire (facultatif)"></textarea>
      <button class="principal">Envoyer mon avis</button>
    </form>`;
}

function demarrerCarte(id, d) {
  const centre = d.latitude != null ? [Number(d.latitude), Number(d.longitude)] : [4.05, 9.7];
  carte = L.map('carte').setView(centre, 12);
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',
    { attribution: '© OpenStreetMap' }).addTo(carte);

  const placer = (lat, lng) => {
    const pos = [Number(lat), Number(lng)];
    if (marqueur) marqueur.setLatLng(pos); else marqueur = L.marker(pos).addTo(carte);
    carte.panTo(pos);
  };
  if (d.latitude != null) placer(d.latitude, d.longitude);
  if (d.statut !== 'en_cours') return;

  minuteur = setInterval(async () => {          // position mise à jour toutes les 15 s
    try {
      const m = await api('/livraisons/' + id);
      if (carte && m.latitude != null) placer(m.latitude, m.longitude);
    } catch (e) { /* on réessaie au prochain passage */ }
  }, 15000);
}

async function ouvrirDetail(id) {
  try {
    const d = await api('/livraisons/' + id);
    clearInterval(minuteur);
    if (carte) { carte.remove(); carte = null; marqueur = null; }
    $('#detail-livraison').innerHTML = `
      <h2>Commande n°${d.id_commande}</h2>
      <p><span class="badge ${esc(d.statut)}">${STATUTS[d.statut] || esc(d.statut)}</span></p>
      <p class="discret">Producteur : ${esc(d.producteur)}<br>
        Transporteur : ${esc(d.transporteur || "en attente d'un transporteur")}<br>
        Transport : ${d.cout_transport != null ? fcfa(d.cout_transport) : 'à calculer'}</p>
      <div id="carte"></div>
      ${d.statut === 'en_cours' ? `<button class="principal" data-confirmer="${d.id_livraison}">Confirmer la réception</button>` : ''}
      ${d.statut === 'validee' ? formulaireAvis(d) : ''}`;
    demarrerCarte(id, d);
  } catch (e) { message(e.message, true); }
}

/* ---------- Événements ---------- */
document.addEventListener('click', async (e) => {
  const b = e.target.closest('button');
  if (!b) return;
  try {
    if (b.dataset.vue) {
      $('#vue-produits').hidden = b.dataset.vue !== 'produits';
      $('#vue-livraisons').hidden = b.dataset.vue !== 'livraisons';
      document.querySelectorAll('nav button').forEach((x) => x.classList.toggle('actif', x === b));
      if (b.dataset.vue === 'livraisons') chargerLivraisons();
    }
    if (b.dataset.ajouter) {
      const p = produits.find((x) => String(x.id_produit) === b.dataset.ajouter);
      if (p) {
        const l = panier.get(p.id_produit);
        panier.set(p.id_produit, { produit: p, quantite: Math.min((l ? l.quantite : 0) + 1, p.quantite_disponible) });
        dessinerPanier();
      }
    }
    if (b.dataset.retirer) { panier.delete(Number(b.dataset.retirer)); dessinerPanier(); }
    if (b.dataset.voir) ouvrirDetail(b.dataset.voir);
    if (b.dataset.confirmer) {
      await api(`/livraisons/${b.dataset.confirmer}/confirmer`, { method: 'POST' });
      message('Réception confirmée. Merci !');
      chargerLivraisons();
      ouvrirDetail(b.dataset.confirmer);
    }
  } catch (err) { message(err.message, true); }
});

document.addEventListener('change', (e) => {
  if (!e.target.dataset.qte) return;
  const l = panier.get(Number(e.target.dataset.qte));
  l.quantite = Math.max(1, Math.min(Number(e.target.value) || 1, l.produit.quantite_disponible));
  dessinerPanier();
});

document.addEventListener('submit', async (e) => {
  e.preventDefault();
  const f = e.target;
  try {
    if (f.id === 'filtres') return chargerProduits();
    if (f.id === 'form-commande') {
      const lignes = [...panier.values()].map((l) => ({ id_produit: l.produit.id_produit, quantite: l.quantite }));
      const r = await api('/commandes', { method: 'POST', body: JSON.stringify({
        lignes, mode_paiement: f.mode_paiement.value, telephone: f.telephone.value }) });
      panier.clear(); dessinerPanier(); chargerProduits();
      message(`Commande n°${r.id_commande} payée : ${fcfa(r.montant_total)}.`);
    }
    if (f.id === 'form-avis') {
      await api('/evaluations', { method: 'POST', body: JSON.stringify({
        id_producteur: f.id_producteur.value, note: f.note.value, commentaire: f.commentaire.value }) });
      message('Merci, votre avis est enregistré.');
      f.reset();
    }
  } catch (err) { message(err.message, true); }
});

chargerProduits();
dessinerPanier();
</script>
</body>
</html>
